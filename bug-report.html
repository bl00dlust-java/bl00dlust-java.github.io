<!doctype html><html lang="ru" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Сообщить об ошибке — Кибергигиена</title><link rel="stylesheet" href="css/styles.css"><style>.report-wrap{max-width:760px;padding:55px 0 90px}.report-card{border:1px solid var(--line);border-radius:18px;background:var(--surface);padding:28px}.report-card label{display:block;margin:16px 0 7px;color:var(--body);font-size:13px}.report-card input,.report-card select,.report-card textarea{width:100%;padding:12px 14px;border:1px solid var(--line-strong);border-radius:9px;background:var(--canvas);color:var(--text);font:inherit}.report-card textarea{min-height:130px;resize:vertical}.report-card .button{margin-top:20px}@media(max-width:600px){.report-card{padding:18px}}</style></head><body><header class="site-header"><div class="header-inner"><a class="brand" href="./"><span class="brand-mark">К</span><span class="brand-name">КИБЕР<span>ГИГИЕНА</span></span></a><span class="eyebrow">ОБРАТНАЯ СВЯЗЬ</span></div></header><main class="wrap report-wrap"><div class="page-kicker"><span class="eyebrow">FEEDBACK / REPORT</span></div><h1 class="page-title">Помоги сделать курс <em>лучше.</em></h1><p class="page-lead">Заполни анкету — откроется письмо, которое можно проверить и отправить.</p><form class="report-card" id="report"><label for="where">1. Где нашли ошибку?</label><select id="where" required><option value="">Выбери страницу</option><option>Главная страница</option><option>Программа / модуль</option><option>Урок</option><option>Тест или разбор ответов</option><option>Результаты / сертификат</option><option>О проекте / FAQ</option><option>Другая страница</option></select><label for="kind">2. Что за проблема?</label><select id="kind" required><option value="">Выбери тип</option><option>Опечатка или ошибка в тексте</option><option>Неверная информация</option><option>Кнопка или ссылка не работает</option><option>Проблема с отображением / дизайном</option><option>Ошибка на телефоне</option><option>Другое</option></select><label for="details">3. Опиши, что произошло</label><textarea id="details" required minlength="10" maxlength="3000" placeholder="Что ожидал увидеть и что произошло?"></textarea><label for="steps">4. Как повторить ошибку? (необязательно)</label><textarea id="steps" maxlength="1500" placeholder="Например: открыть модуль → нажать кнопку…"></textarea><label for="device">5. Устройство / браузер (необязательно)</label><input id="device" maxlength="200" placeholder="Например: Android, Chrome"><label for="email">6. Контакт для ответа (необязательно)</label><input id="email" type="email" maxlength="200" placeholder="Email"><p class="notice">Не указывай пароли, коды подтверждения или другие секреты.</p><button class="button" type="submit">Подготовить письмо <span>→</span></button></form></main><script>document.getElementById("report").addEventListener("submit",e=>{e.preventDefault();const v=id=>document.getElementById(id).value.trim()||"—";const body=["Баг сайта «Кибергигиена»","","Страница: "+v("where"),"Категория: "+v("kind"),"Описание: "+v("details"),"Шаги: "+v("steps"),"Устройство / браузер: "+v("device"),"Контакт: "+v("email"),"URL: "+location.href,"Дата: "+new Date().toLocaleString("ru-RU")].join("\n");location.href="mailto:jeleshkasus@gmail.com?subject="+encodeURIComponent("[Баг сайта] "+v("kind"))+"&body="+encodeURIComponent(body);});</script></body></html>
