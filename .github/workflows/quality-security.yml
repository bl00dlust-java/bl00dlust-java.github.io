name: Quality and security checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  syntax:
    name: JavaScript and TypeScript checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install React dependencies and build
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit generated lockfile to the PR branch
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const branch = context.payload.pull_request.head.ref;
            const headRepo = context.payload.pull_request.head.repo.full_name;
            if (headRepo !== `${owner}/${repo}`) {
              throw new Error('Refusing to write a lockfile to a fork branch.');
            }
            const path = 'package-lock.json';
            let sha;
            try {
              const current = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const content = fs.readFileSync(path).toString('base64');
            const result = await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch, sha,
              message: 'build: add npm dependency lockfile',
              content
            });
            core.info(`Lockfile committed: ${result.data.commit.sha}`);
      - name: Verify reproducible install from lockfile
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Check JavaScript syntax
        run: |
          find . -type f -name '*.js' -not -path './.git/*' -not -path './node_modules/*' -not -path './dist/*' -print0 | xargs -0 -r -n1 node --check
          find . -type f -name '*.mjs' -not -path './.git/*' -not -path './node_modules/*' -not -path './dist/*' -print0 | xargs -0 -r -n1 node --check
      - name: Validate published content and simulators
        run: node scripts/validate-content.mjs
      - name: Check legacy TypeScript without rewriting generated JavaScript
        run: npm run typecheck:legacy

  codeql:
    name: CodeQL security analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
