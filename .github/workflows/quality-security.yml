name: Quality and security checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  syntax:
    name: JavaScript and TypeScript checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies and build
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Check JavaScript syntax
        run: |
          find . -type f -name '*.js' -not -path './.git/*' -not -path './node_modules/*' -not -path './dist/*' -print0 | xargs -0 -r -n1 node --check
          find . -type f -name '*.mjs' -not -path './.git/*' -not -path './node_modules/*' -not -path './dist/*' -print0 | xargs -0 -r -n1 node --check
      - name: Validate published content and simulators
        run: node scripts/validate-content.mjs
      - name: Check legacy TypeScript without rewriting generated JavaScript
        run: npm run typecheck:legacy

  codeql:
    name: CodeQL security analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
